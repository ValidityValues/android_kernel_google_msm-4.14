name: Build Pixel 4 Kernel
run-name: Build ${{ inputs.kernel_name }} by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      kernel_name:
        description: 'Kernel name shown in the installer and kernel release'
        required: true
        type: string
        default: 'Validity Pixel 4 Kernel'

permissions:
  contents: read

concurrency:
  group: pixel4-kernel-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Compile and package (Pixel 4 / floral)
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /usr/local/share/boost /usr/local/.ghcup
          df -h /

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install kernel build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            bc bison build-essential ca-certificates curl flex git \
            libelf-dev libncurses-dev libssl-dev lz4 make perl python3 zip

      - name: Cache Android Clang toolchain
        uses: actions/cache@v4
        with:
          path: .toolchains/clang-r416183b
          key: android-clang-r416183b-${{ runner.os }}

      - name: Validate clean baseline scripts
        run: |
          bash -n compile.sh
          grep -q 'DEFCONFIG=floral_defconfig' compile.sh
          grep -q 'reset_ak;' compile.sh
          grep -q 'BLOCK=boot;' compile.sh
          grep -q 'IS_SLOT_DEVICE=1;' compile.sh
          grep -q 'split_boot;' compile.sh
          grep -q 'flash_boot;' compile.sh
          grep -q 'CONFIG_LOCALVERSION_AUTO' compile.sh
          grep -q 'sm8150-v2.dtb' compile.sh
          if grep -Eq 'KSU_NEXT|KSU_HOOK_MODE|KSU_TAG|KSU_REPO_URL|PY_MANUAL|KernelSU-Next.git' compile.sh .github/workflows/build-kernel.yml; then
            echo 'KernelSU integration residue found in clean baseline workflow.' >&2
            exit 1
          fi

      - name: Build and package AnyKernel3 ZIP
        env:
          KERNEL_NAME: ${{ inputs.kernel_name }}
          JOBS: '3'
        run: |
          chmod +x compile.sh
          (
            while sleep 60; do
              echo "::notice::Build heartbeat $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
              free -h
              ps -C ld.lld -C clang -C ld -o pid,etime,%cpu,%mem,rss,comm --sort=-rss | head -n 8 || true
            done
          ) &
          watcher=$!
          trap 'kill "$watcher" 2>/dev/null || true; wait "$watcher" 2>/dev/null || true' EXIT
          ./compile.sh

      - name: Upload kernel ZIP and diagnostic files
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: pixel4-kernel-${{ github.run_number }}
          path: |
            dist/*.zip
            out/compile.log
            out/.config
            out/arch/arm64/boot/Image.lz4
            out/arch/arm64/boot/dtbo.img
            out/arch/arm64/boot/dts/google/qcom-base/sm8150.dtb
            out/arch/arm64/boot/dts/google/qcom-base/sm8150-v2.dtb
            out/include/config/kernel.release
            out/include/generated/utsrelease.h
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
