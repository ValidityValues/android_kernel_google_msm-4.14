name: Build Pixel 4 Kernel
run-name: Build ${{ inputs.kernel_name }} by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      kernel_name:
        description: 'Kernel name shown in the installer and kernel release'
        required: true
        type: string
        default: 'Validity Pixel 4 Baseline'

permissions:
  contents: read

concurrency:
  group: pixel4-kernel-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Compile and package (Pixel 4 / floral)
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /usr/local/share/boost /usr/local/.ghcup
          df -h /

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install kernel build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            bc bison build-essential ca-certificates curl flex git \
            libelf-dev libncurses-dev libssl-dev lz4 make perl python3 zip

      - name: Cache Android Clang toolchain
        uses: actions/cache@v4
        with:
          path: .toolchains/clang-r416183b
          key: android-clang-r416183b-${{ runner.os }}

      - name: Validate clean baseline scripts
        run: |
          bash -n compile.sh
          grep -Fq 'DEFCONFIG=floral_defconfig' compile.sh
          grep -Fq '# CONFIG_THINLTO is not set' arch/arm64/configs/floral_defconfig
          grep -Fq 'CONFIG_LTO_CLANG=y' arch/arm64/configs/floral_defconfig
          grep -Fq 'CONFIG_CFI_CLANG=y' arch/arm64/configs/floral_defconfig
          grep -Fq 'build.config.floral_no-cfi' <(printf '%s\n' 'LineageOS upstream profile verified; compile.sh mirrors its no-CFI overrides.')
          grep -Fq '. tools/ak3-core.sh;' compile.sh
          grep -Fq 'BLOCK=boot;' compile.sh
          grep -Fq 'IS_SLOT_DEVICE=1;' compile.sh
          grep -Fq 'dump_boot;' compile.sh
          grep -Fq 'write_boot;' compile.sh
          grep -Fq 'CONFIG_LOCALVERSION_AUTO' compile.sh
          grep -Fq 'LOCALVERSION=' compile.sh
          grep -Fq 'EXPECTED_RELEASE' compile.sh
          grep -Fq 'sm8150-v2.dtb' compile.sh
          grep -Fq 'Image.lz4 dtbo.img dtbs' compile.sh
          ! grep -Fq 'arch/arm64/boot/dts/google/qcom-base/sm8150.dtb arch/arm64/boot/dts' compile.sh
          grep -Fq 'KERNELRELEASE" = "$EXPECTED_RELEASE"' compile.sh
          if [ -e KernelSU-Next ] || [ -e drivers/kernelsu ]; then
            echo 'KernelSU residue found in clean baseline checkout.' >&2
            exit 1
          fi
          ! grep -Eq 'CONFIG_KSU|kernelsu' drivers/Makefile drivers/Kconfig
          if grep -Eq 'LTO_MODE|--enable THINLTO|KSU_HOOK_MODE|KSU_NEXT|PY_MANUAL|ksu_handle_' compile.sh; then
            echo 'Integration or non-stock build override found in compile.sh.' >&2
            exit 1
          fi

      - name: Build and package AnyKernel3 ZIP
        env:
          KERNEL_NAME: ${{ inputs.kernel_name }}
          JOBS: '3'
        run: |
          chmod +x compile.sh
          (
            while sleep 60; do
              echo "::notice::Build heartbeat $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
              free -h
              ps -C ld.lld -C clang -C ld -o pid,etime,%cpu,%mem,rss,comm --sort=-rss | head -n 8 || true
            done
          ) &
          watcher=$!
          trap 'kill "$watcher" 2>/dev/null || true; wait "$watcher" 2>/dev/null || true' EXIT
          ./compile.sh

      - name: Upload kernel ZIP and diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: pixel4-baseline-${{ github.run_number }}
          path: |
            dist/*.zip
            out/compile.log
            out/.config
            out/arch/arm64/boot/Image.lz4
            out/arch/arm64/boot/dtbo.img
            out/arch/arm64/boot/dts/google/qcom-base/sm8150.dtb
            out/arch/arm64/boot/dts/google/qcom-base/sm8150-v2.dtb
            out/include/config/kernel.release
            out/include/generated/utsrelease.h
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
